[[command]]
path = ""
use = "yutu"
short = "CLI, MCP server, and AI agent to automate YouTube workflows"
long = """
yutu is a CLI, MCP server, and AI agent that automates your YouTube workflows from the terminal or any AI client.

Environment variables:
  YUTU_CREDENTIAL    Path/Base64/JSON of OAuth client secret (default: client_secret.json)
  YUTU_CACHE_TOKEN   Path/Base64/JSON of cached OAuth token (default: youtube.token.json)
  YUTU_ROOT          Root directory for file resolution (default: current working directory)
  YUTU_LOG_LEVEL     Log level: DEBUG, INFO, WARN, ERROR (default: INFO)"""
runnable = true

[[command]]
path = "agent"
use = "agent"
short = "Start an agent to automate YouTube workflows"
long = "Start an agent to automate YouTube workflows."
example = """
# Gemini(compatible) (default)
yutu agent --provider google --model gemini-3.8-flash --api-key "YOUR_KEY"
yutu agent --provider google --model gemini-3.8-flash --api-key "YOUR_KEY" --base-url "https://custom.endpoint.com/"
# OpenAI(compatible) (OpenAI, DeepSeek, Ollama, vLLM, etc.)
yutu agent --provider openai --model gpt-5.6-terra --api-key "YOUR_KEY"
yutu agent --provider openai --model deepseek-flash --api-key "YOUR_KEY" --base-url "https://api.deepseek.com/""""
runnable = true

[[command.flag]]
name = "api-key"
type = "string"
default = ""
usage = "API key for the model provider"

[[command.flag]]
name = "args"
short = "a"
type = "string"
default = "console"
usage = "Launcher arguments as a single string"

[[command.flag]]
name = "base-url"
type = "string"
default = ""
usage = "Base URL for the model provider's API endpoint"

[[command.flag]]
name = "instruction"
short = "i"
type = "string"
default = ""
usage = "Override the built-in agent instruction"

[[command.flag]]
name = "model"
short = "m"
type = "string"
default = "gemini-3.8-flash"
usage = "Model name"

[[command.flag]]
name = "provider"
short = "p"
type = "string"
default = "google"
usage = "LLM provider: google for Gemini(compatible), openai for OpenAI(compatible)"

[[command]]
path = "auth"
use = "auth"
short = "Authenticate with YouTube APIs"
long = "Authenticate with YouTube APIs to access and manage YouTube resources."
runnable = true

[[command.flag]]
name = "cacheToken"
short = "t"
type = "string"
default = "youtube.token.json"
usage = "Path to token cache file, or Base64 encoded string, or JSON string (env: YUTU_CACHE_TOKEN)"

[[command.flag]]
name = "credential"
short = "c"
type = "string"
default = "client_secret.json"
usage = "Path to client secret file, or Base64 encoded string, or JSON string (env: YUTU_CREDENTIAL)"

[[command]]
path = "completion"
use = "completion"
short = "Generate the autocompletion script for the specified shell"
long = """
Generate the autocompletion script for yutu for the specified shell.
See each sub-command's help for details on how to use the generated script.
"""
runnable = false

[[command]]
path = "completion bash"
use = "bash"
short = "Generate the autocompletion script for bash"
long = """
Generate the autocompletion script for the bash shell.

This script depends on the 'bash-completion' package.
If it is not installed already, you can install it via your OS's package manager.

To load completions in your current shell session:

\tsource <(yutu completion bash)

To load completions for every new session, execute once:

#### Linux:

\tyutu completion bash > /etc/bash_completion.d/yutu

#### macOS:

\tyutu completion bash > $(brew --prefix)/etc/bash_completion.d/yutu

You will need to start a new shell for this setup to take effect.
"""
runnable = true

[[command.flag]]
name = "no-descriptions"
type = "bool"
default = "false"
no_opt_default = "true"
usage = "disable completion descriptions"

[[command]]
path = "completion fish"
use = "fish"
short = "Generate the autocompletion script for fish"
long = """
Generate the autocompletion script for the fish shell.

To load completions in your current shell session:

\tyutu completion fish | source

To load completions for every new session, execute once:

\tyutu completion fish > ~/.config/fish/completions/yutu.fish

You will need to start a new shell for this setup to take effect.
"""
runnable = true

[[command.flag]]
name = "no-descriptions"
type = "bool"
default = "false"
no_opt_default = "true"
usage = "disable completion descriptions"

[[command]]
path = "completion powershell"
use = "powershell"
short = "Generate the autocompletion script for powershell"
long = """
Generate the autocompletion script for powershell.

To load completions in your current shell session:

\tyutu completion powershell | Out-String | Invoke-Expression

To load completions for every new session, add the output of the above command
to your powershell profile.
"""
runnable = true

[[command.flag]]
name = "no-descriptions"
type = "bool"
default = "false"
no_opt_default = "true"
usage = "disable completion descriptions"

[[command]]
path = "completion zsh"
use = "zsh"
short = "Generate the autocompletion script for zsh"
long = """
Generate the autocompletion script for the zsh shell.

If shell completion is not already enabled in your environment you will need
to enable it.  You can execute the following once:

\techo "autoload -U compinit; compinit" >> ~/.zshrc

To load completions in your current shell session:

\tsource <(yutu completion zsh)

To load completions for every new session, execute once:

#### Linux:

\tyutu completion zsh > "${fpath[1]}/_yutu"

#### macOS:

\tyutu completion zsh > $(brew --prefix)/share/zsh/site-functions/_yutu

You will need to start a new shell for this setup to take effect.
"""
runnable = true

[[command.flag]]
name = "no-descriptions"
type = "bool"
default = "false"
no_opt_default = "true"
usage = "disable completion descriptions"

[[command]]
path = "help"
use = "help [command]"
short = "Help about any command"
long = """
Help provides help for any command in the application.
Simply type yutu help [path to command] for full details."""
runnable = true

[[command]]
path = "mcp"
use = "mcp"
short = "Start MCP server"
long = "Start MCP server to handle requests from clients"
example = """
# Start MCP server in stdio mode (default)
yutu mcp

# Start MCP server in HTTP mode at http://localhost:8216/mcp
# Requires OAuth (Google account) for all MCP tool calls
yutu mcp --mode http"""
runnable = true

[[command.flag]]
name = "baseUrl"
short = "b"
type = "string"
default = ""
usage = "Base URL for the MCP server (default http://<host>:<port>)"
hidden = true

[[command.flag]]
name = "host"
type = "string"
default = "127.0.0.1"
usage = "Host to bind for HTTP mode"
hidden = true

[[command.flag]]
name = "mode"
short = "m"
type = "string"
default = "stdio"
usage = "stdio|http"

[[command.flag]]
name = "port"
short = "p"
type = "int"
default = "8216"
usage = "Port to listen on for HTTP mode"
hidden = true

[[command.flag]]
name = "stateless"
type = "bool"
default = "true"
no_opt_default = "true"
usage = "Enable stateless HTTP mode (required for MCP 2026-07-28 clients)"
hidden = true

[[command]]
path = "version"
use = "version"
short = "Show the version of yutu"
long = "Show the version of yutu."
runnable = true
