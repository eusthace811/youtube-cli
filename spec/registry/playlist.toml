    "privacy": {
      "description": "public|private|unlisted",
      "enum": [
        "public",
        "private",
        "unlisted"
      ],
      "type": "string"
    },
    "tags": {
      "description": "Comma separated tags",
      "items": {
        "type": "string"
      },
      "type": "array"
    },
    "title": {
      "description": "Title of the playlist",
      "type": "string"
    }
  },
  "required": [
    "ids"
  ],
  "type": "object"
}"""

[[command.flag]]
name = "description"
short = "d"
type = "string"
default = ""
usage = "Description of the playlist"

[[command.flag]]
name = "id"
short = "i"
type = "stringSlice"
default = "[]"
usage = "ID of the playlist to update"
required = true

[[command.flag]]
name = "language"
short = "l"
type = "string"
default = ""
usage = "Language of the playlist"

[[command.flag]]
name = "output"
short = "o"
type = "string"
default = ""
usage = "json|yaml|silent"

[[command.flag]]
name = "privacy"
short = "p"
type = "string"
default = ""
usage = "public|private|unlisted"

[[command.flag]]
name = "tags"
short = "a"
type = "stringSlice"
default = "[]"
usage = "Comma separated tags"

[[command.flag]]
name = "title"
short = "t"
type = "string"
default = ""
usage = "Title of the playlist"

[[command.flag]]
name = "yes"
type = "bool"
default = "false"
no_opt_default = "true"
