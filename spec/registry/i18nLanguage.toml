[[command]]
path = "i18nLanguage"
use = "i18nLanguage"
short = "Manage YouTube i18n languages"
long = "Manage YouTube i18n languages. Use this tool to list available internationalization languages."
runnable = true

[[command]]
path = "i18nLanguage list"
use = "list"
short = "List i18n languages"
long = "List i18n languages. Use this tool to list available internationalization languages."
runnable = true

[[command.flag]]
name = "hl"
short = "l"
type = "string"
default = ""
usage = "Host language"

[[command.flag]]
name = "output"
short = "o"
type = "string"
default = "table"
usage = "json|yaml|table"

[[command.flag]]
name = "parts"
short = "p"
type = "stringSlice"
default = "[id,snippet]"
usage = "Comma separated parts"
