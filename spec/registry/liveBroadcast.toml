usage = "Broadcast status filter (all, active, upcoming, completed)"

[[command.flag]]
name = "broadcastType"
short = "T"
type = "string"
default = ""
usage = "Broadcast type filter (all, event, persistent)"

[[command.flag]]
name = "ids"
short = "i"
type = "stringSlice"
default = "[]"
usage = "Return live broadcasts with the given ids"

[[command.flag]]
name = "maxResults"
short = "n"
type = "int64"
default = "5"
usage = "The maximum number of items that should be returned, 0 for no limit"

[[command.flag]]
