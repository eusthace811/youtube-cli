[[command]]
path = "video list"
use = "list"
short = "List videos"
long = "List videos. Use this tool to list videos."
example = """
# List a video by ID
youtube video list --ids IBju0NwjQRc
# List multiple videos in JSON format
youtube video list --ids IBju0NwjQRc,wZ9z3FUuNvQ --output json
# List most popular videos by region
youtube video list --chart mostPopular --regionCode US --maxResults 10
# List my liked videos
youtube video list --myRating like --output yaml"""
runnable = true

[command.tool]
name = "video-list"
title = "List videos"
description = "List videos. Use this tool to list videos."
effect = "read"
idempotent = true
input_schema = """
{
  "properties": {
    "category_id": {
      "description": "Category of the video",
      "type": "string"
    },
    "chart": {
      "description": "chartUnspecified|mostPopular",
      "enum": [
        "chartUnspecified",
        "mostPopular"
      ],
      "type": "string"
    },
    "hl": {
      "description": "Specifies the localization language",
      "type": "string"
    },
    "ids": {
      "description": "Return videos with the given ids",
      "items": {
        "type": "string"
      },
      "type": "array"
    },
    "locale": {
      "description": "Locale of the video metadata to return",
      "type": "string"
    },
    "max_height": {
      "description": "Max height of the embedded player in pixels",
      "minimum": 0,
      "type": "number"
    },
    "max_results": {
      "default": 5,
      "description": "The maximum number of items that should be returned, 0 for no limit",
      "minimum": 0,
      "type": "number"
    },
    "max_width": {
      "description": "Max width of the embedded player in pixels",
      "minimum": 0,
      "type": "number"
    },
    "on_behalf_of_content_owner": {
      "description": "ID of the content owner, for YouTube content partners",
      "type": "string"
    },
    "output": {
      "default": "json",
      "description": "json|yaml|table",
      "enum": [
        "json",
        "yaml",
        "table"
      ],
      "type": "string"
    },
    "parts": {
      "default": [
        "id",
        "snippet",
        "status",
        "statistics"
      ],
      "description": "Comma separated parts",
      "items": {
        "type": "string"
      },
      "type": "array"
    },
    "rating": {
      "description": "Return videos liked/disliked by the authenticated user",
      "type": "string"
    },
    "region_code": {
      "description": "Specific to the specified region",
      "type": "string"
    }
  },
  "type": "object"
}"""

[[command.flag]]
name = "chart"
short = "c"
type = "string"
default = ""
usage = "chartUnspecified|mostPopular"

[[command.flag]]
name = "hl"
short = "l"
type = "string"
default = ""
usage = "Specifies the localization language"

[[command.flag]]
name = "ids"
short = "i"
type = "stringSlice"
default = "[]"
usage = "Return videos with the given ids"

[[command.flag]]
name = "locale"
short = "L"
type = "string"
default = ""
usage = "Locale of the video metadata to return"

[[command.flag]]
name = "maxHeight"
short = "H"
type = "int64"
default = "0"
usage = "Max height of the embedded player in pixels"

[[command.flag]]
name = "maxResults"
short = "n"
type = "int64"
default = "5"
usage = "The maximum number of items that should be returned, 0 for no limit"

[[command.flag]]
name = "maxWidth"
short = "W"
type = "int64"
default = "0"
usage = "Max width of the embedded player in pixels"

[[command.flag]]
name = "myRating"
short = "R"
type = "string"
default = ""
usage = "Return videos liked/disliked by the authenticated user"

[[command.flag]]
name = "onBehalfOfContentOwner"
short = "b"
type = "string"
default = ""
usage = "ID of the content owner, for YouTube content partners"

[[command.flag]]
name = "output"
short = "o"
type = "string"
default = "table"
usage = "json|yaml|table"

[[command.flag]]
name = "parts"
short = "p"
type = "stringSlice"
default = "[id,snippet,status,statistics]"
usage = "Comma separated parts"

[[command.flag]]
name = "regionCode"
short = "r"
type = "string"
default = ""
usage = "Specific to the specified region"

[[command.flag]]
name = "videoCategoryId"
short = "g"
type = "string"
default = ""
usage = "Category of the video"

[[command]]
path = "video rate"
use = "rate"
short = "Rate a video"
long = "Rate a video. Use this tool to rate a video."
example = """
# Like a video
youtube video rate --ids dQw4w9WgXcQ --rating like
# Dislike multiple videos
youtube video rate --ids dQw4w9WgXcQ,abc123 --rating dislike
# Remove rating from a video
youtube video rate --ids dQw4w9WgXcQ --rating none"""
