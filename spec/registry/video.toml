[[command]]
path = "video"
use = "video"
short = "Manage YouTube videos"
long = "Manage YouTube videos. Use this tool to list, upload, update, delete, get rating, or report videos."
runnable = true

[[command]]
path = "video delete"
use = "delete"
short = "Delete videos"
long = "Delete videos. Use this tool to delete videos by IDs."
example = """
# Delete a video by ID
youtube video delete --ids dQw4w9WgXcQ
# Delete multiple videos
youtube video delete --ids dQw4w9WgXcQ,abc123"""
runnable = true

[command.tool]
name = "video-delete"
title = "Delete videos"
description = "Delete videos. Use this tool to delete videos by IDs."
effect = "destructive"
idempotent = false
input_schema = """
{
  "properties": {
    "ids": {
      "description": "IDs of the videos to delete",
      "items": {
        "type": "string"
      },
      "type": "array"
    }
  },
  "required": [
    "ids"
  ],
  "type": "object"
}"""

[[command.flag]]
name = "ids"
short = "i"
type = "stringSlice"
default = "[]"
usage = "IDs of the videos to delete"
required = true

[[command.flag]]
name = "yes"
type = "bool"
default = "false"
no_opt_default = "true"
usage = "Confirm the operation"

[[command]]
path = "video getRating"
use = "getRating"
short = "Get video ratings"
long = "Get video ratings. Use this tool to get video ratings by IDs."
example = """
# Get rating of a video
youtube video getRating --ids dQw4w9WgXcQ
# Get ratings of multiple videos in JSON format
youtube video getRating --ids dQw4w9WgXcQ,abc123 --output json"""
runnable = true

[command.tool]
name = "video-getRating"
title = "Get video ratings"
description = "Get video ratings. Use this tool to get video ratings by IDs."
effect = "read"
idempotent = true
input_schema = """
{
  "properties": {
    "ids": {
      "description": "IDs of the videos to get the rating for",
      "items": {
        "type": "string"
      },
      "type": "array"
    },
    "on_behalf_of_content_owner": {
      "description": "ID of the content owner, for YouTube content partners",
      "type": "string"
    },
    "output": {
      "default": "json",
      "description": "json|yaml|table",
      "enum": [
        "json",
        "yaml",
        "table"
      ],
      "type": "string"
    }
  },
  "required": [
    "ids"
  ],
  "type": "object"
}"""

[[command.flag]]
name = "ids"
short = "i"
type = "stringSlice"
default = "[]"
usage = "IDs of the videos to get the rating for"
required = true

[[command.flag]]
name = "onBehalfOfContentOwner"
short = "b"
type = "string"
default = ""
usage = "ID of the content owner, for YouTube content partners"

[[command.flag]]
name = "output"
short = "o"
type = "string"
default = "table"
usage = "json|yaml|table"

[[command]]
path = "video insert"
use = "insert"
short = "Upload a video"
long = "Upload a video. Use this tool to upload a video."
example = """
# Upload a public video
youtube video insert --file video.mp4 --title 'My Video' --categoryId 22 --privacy public
# Upload a private video with tags
youtube video insert --file video.mp4 --title 'Tutorial' --categoryId 27 --privacy private --tags 'go,tutorial'
# Upload an unlisted video with custom thumbnail
youtube video insert --file video.mp4 --title 'Music Video' --categoryId 10 --privacy unlisted --thumbnail cover.jpg"""
runnable = true

[command.tool]
name = "video-insert"
title = "Upload a video"
description = "Upload a video. Use this tool to upload a video."
effect = "write"
idempotent = false
input_schema = """
{
  "properties": {
    "auto_levels": {
      "description": "Should auto-levels be applied to the upload",
      "type": "boolean"
    },
    "category_id": {
      "description": "Category of the video",
      "type": "string"
    },
    "channel_id": {
      "description": "Channel id of the video",
      "type": "string"
    },
    "contains_synthetic_media": {
      "default": false,
      "description": "Whether the video contains altered or synthetic media",
      "type": "boolean"
    },
    "description": {
      "description": "Description of the video",
      "type": "string"
    },
    "embeddable": {
      "description": "Whether the video is embeddable",
      "type": "boolean"
    },
    "file": {
      "description": "Path to the video file",
      "type": "string"
    },
    "for_kids": {
      "default": false,
      "description": "Whether the video is for kids",
      "type": "boolean"
    },
    "language": {
      "description": "Language of the video",
      "type": "string"
    },
    "license": {
      "description": "youtube|creativeCommon",
      "enum": [
        "youtube",
        "creativeCommon"
      ],
      "type": "string"
    },
    "notify_subscribers": {
      "description": "Notify the channel subscribers about the new video",
      "type": "boolean"
    },
    "on_behalf_of_content_owner": {
      "description": "ID of the content owner, for YouTube content partners",
      "type": "string"
    },
    "on_behalf_of_content_owner_channel": {
      "description": "YouTube channel ID linked to the content owner",
      "type": "string"
    },
    "output": {
      "default": "json",
      "description": "json|yaml|silent",
      "enum": [
        "json",
        "yaml",
        "silent"
      ],
      "type": "string"
    },
    "playlist_id": {
      "description": "Playlist id of the video",
      "type": "string"
    },
    "privacy": {
      "description": "public|private|unlisted",
      "enum": [
        "public",
        "private",
        "unlisted"
      ],
      "type": "string"
    },
    "public_stats_viewable": {
      "description": "Whether the extended video statistics can be viewed by everyone",
      "type": "boolean"
    },
    "publish_at": {
      "description": "Datetime when the video is scheduled to publish",
      "type": "string"
    },
    "recording_date": {
      "description": "Date and time when the video was recorded",
      "type": "string"
    },
    "stabilize": {
      "description": "Should stabilize be applied to the upload",
      "type": "boolean"
    },
    "tags": {
      "default": [
        "youtube🐰"
      ],
      "description": "Comma separated tags",
      "items": {
        "type": "string"
      },
      "type": "array"
    },
    "thumbnail": {
      "description": "Path to the thumbnail file",
      "type": "string"
    },
    "title": {
      "description": "Title of the video",
      "type": "string"
    }
  },
  "required": [
    "file",
    "category_id",
    "privacy"
  ],
  "type": "object"
