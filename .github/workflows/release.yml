name: release

# A tag push builds the six release binaries under Go's asset names, then
# publishes them with SHA256SUMS, a CycloneDX SBOM, and a build-provenance
# attestation per binary. install.sh verifies the sums and attestations.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: darwin, arch: amd64, target: x86_64-apple-darwin, runner: macos-latest, smoke: false }
          - { os: darwin, arch: arm64, target: aarch64-apple-darwin, runner: macos-latest, smoke: true }
          - { os: linux, arch: amd64, target: x86_64-unknown-linux-musl, runner: ubuntu-latest, smoke: true }
          - { os: linux, arch: arm64, target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, smoke: true }
          - { os: windows, arch: amd64, target: x86_64-pc-windows-msvc, runner: windows-latest, smoke: true }
          - { os: windows, arch: arm64, target: aarch64-pc-windows-msvc, runner: windows-latest, smoke: false }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the pinned toolchain and the target
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        env:
          YUTU_VERSION: ${{ github.ref_name }}
          YUTU_BUILDER: ${{ github.actor }}
        run: |
          export YUTU_COMMIT_DATE="$(git log -1 --date='format:%Y-%m-%dT%H:%M:%SZ' --pretty=%cd)"
          cargo build --release --locked -p yutu --target ${{ matrix.target }}
          ext=""
          [[ "${{ matrix.os }}" == "windows" ]] && ext=".exe"
          mkdir -p out
          cp "target/${{ matrix.target }}/release/yutu${ext}" "out/yutu-${{ matrix.os }}-${{ matrix.arch }}${ext}"
      - name: Smoke test every command's help
        if: matrix.smoke
        shell: bash
        run: ./scripts/command-test.sh out/yutu-*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yutu-${{ matrix.os }}-${{ matrix.arch }}
          path: out/yutu-*
          if-no-files-found: error

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - name: CycloneDX SBOM of the yutu binary's dependency graph
        run: |
          cargo install --locked cargo-cyclonedx@0.5.9
          cargo cyclonedx --manifest-path crates/yutu/Cargo.toml --format json \
            --spec-version 1.5 --target all --no-build-deps --override-filename yutu.cdx
          mkdir -p out
          mv crates/yutu/yutu.cdx.json out/yutu.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: out/yutu.cdx.json
          if-no-files-found: error

  release:
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-out
          merge-multiple: true
      - name: Check the six binaries for unexpected network hosts
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo run --locked -p xtask -- egress --release dist-out/yutu-*-*
      - name: SHA256SUMS
        working-directory: dist-out
        run: |
          sha256sum yutu-darwin-amd64 yutu-darwin-arm64 yutu-linux-amd64 yutu-linux-arm64 \
            yutu-windows-amd64.exe yutu-windows-arm64.exe yutu.cdx.json > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-out/yutu-darwin-amd64
            dist-out/yutu-darwin-arm64
            dist-out/yutu-linux-amd64
            dist-out/yutu-linux-arm64
            dist-out/yutu-windows-amd64.exe
            dist-out/yutu-windows-arm64.exe
      - name: winget manifests
        run: dist/winget/render.sh "${GITHUB_REF_NAME#v}" dist-out/SHA256SUMS winget-out "${GITHUB_REPOSITORY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget-manifests
          path: winget-out
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ "${GITHUB_REF_NAME}" == *-* ]] && prerelease="--prerelease"
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
            ${prerelease} --title "${GITHUB_REF_NAME}" \
            --notes "Install: \`curl -sSfL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/install.sh | bash\`. Verify a binary: \`gh attestation verify yutu-linux-amd64 --repo ${GITHUB_REPOSITORY}\`." \
            dist-out/yutu-*-* dist-out/yutu.cdx.json dist-out/SHA256SUMS
