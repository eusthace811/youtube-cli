name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - run: cargo run --locked -p xtask -- egress --release target/release/yutu
      - run: cargo run --locked -p xtask -- gen-api --check
      - name: cargo deny
        run: |
          cargo install --locked cargo-deny@0.20.2
          cargo deny check
      - name: cargo audit
        run: |
          cargo install --locked cargo-audit@0.22.2
          cargo audit
      - run: cargo run --locked -p xtask -- skillgen --check
      - run: cargo run --locked -p xtask -- smokegen --check
      - run: ./scripts/command-test.sh target/release/yutu
