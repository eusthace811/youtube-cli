[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/youtube"]

[workspace.package]
version = "0.11.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99.1"
repository = "https://github.com/eat-pray-ai/yutu"

[workspace.dependencies]
youtube-api = { path = "crates/youtube-api" }
youtube-auth = { path = "crates/youtube-auth" }
youtube-core = { path = "crates/youtube-core" }
youtube-mcp = { path = "crates/youtube-mcp" }
youtube-agent = { path = "crates/youtube-agent" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

# Build scripts run optimized: youtube-agent's compresses the dev UI bundle.
[profile.release.build-override]
opt-level = 3

[profile.dev.build-override]
opt-level = 3

[profile.dev]
debug = 1
