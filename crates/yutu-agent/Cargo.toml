[package]
name = "yutu-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
yutu-api.workspace = true
yutu-auth.workspace = true
yutu-core.workspace = true
yutu-mcp.workspace = true
serde_json.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "gzip", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "signal", "net", "process", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
rustix = { version = "1", default-features = false, features = ["std", "termios", "process"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
brotli-decompressor = "6"

[build-dependencies]
brotli = "9"

[dev-dependencies]
yutu-api = { workspace = true, features = ["parity-endpoint"] }
tokio = { version = "1", features = ["rt", "net", "io-util"] }
ring = { version = "0.17", default-features = false }
