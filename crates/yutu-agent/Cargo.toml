[package]
name = "yutu-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
yutu-api.workspace = true
yutu-auth.workspace = true
yutu-core.workspace = true
yutu-mcp.workspace = true
serde_json.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "gzip", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "signal"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"

[dev-dependencies]
yutu-api = { workspace = true, features = ["parity-endpoint"] }
tokio = { version = "1", features = ["rt", "net", "io-util"] }
