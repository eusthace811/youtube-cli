# Appendix E of the plan. The differ accepts a difference only for a case
# that names one of these ids, and only in the listed fields. Each entry
# also names the PR and the test that proves the new behavior.

[divergence.E1]
summary = "caption download is confirmation-gated and writes only through the sandbox, so it can never overwrite a token or secret"
prs = ["R4", "R6", "R12"]
fields = ["requests", "stdout", "stderr", "exit", "files"]
proof = "cli.caption.download.*.yes cases match Go's golden for the ungated command; crates/yutu-core/tests/fsroot.rs refuses youtube.token.json and fsroot_token_env.rs a token named by an absolute path"

